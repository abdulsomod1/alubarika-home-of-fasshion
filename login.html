<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | Albarika</title><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/storefront.css"><link rel="stylesheet" href="css/responsive.css"><script type="module" src="js/site.js"></script><script type="module" src="js/auth-pages.js"></script></head><body data-page="login"><div data-site-header></div><main class="form-shell"><p class="eyebrow eyebrow--ink">WELCOME BACK</p><h1>Come on in.</h1><p class="form-intro">Sign in with your username or email address.</p><form data-login-form><div class="field"><label for="identifier">Username or email</label><input id="identifier" name="identifier" autocomplete="username" required></div><div class="field"><label for="password">Password</label><div class="password-row"><input id="password" name="password" type="password" autocomplete="current-password" required><button class="password-toggle" type="button" data-password-toggle="password">Show</button></div></div><p class="form-error" data-form-error aria-live="polite"></p><button class="button button--dark" type="submit">Sign in <span aria-hidden="true">↗</span></button></form><p class="form-foot"><a href="recover-account.html">Recover account</a> · New to Albarika? <a href="signup.html">Create an account</a></p></main><div data-site-footer></div><div class="toast-region" aria-live="polite"></div></body></html>
