<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account recovery | Albarika</title><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/storefront.css"><link rel="stylesheet" href="css/responsive.css"><script type="module" src="js/site.js"></script><script type="module" src="js/auth-pages.js"></script></head><body data-page="recovery"><div data-site-header></div><main class="form-shell"><p class="eyebrow eyebrow--ink">ACCOUNT ACCESS</p><h1>Let’s get you back in.</h1><p class="form-intro">Recovery uses the security question you set at signup, not access to an email inbox.</p><form data-recovery-form><div class="field"><label for="recovery-username">Username</label><input id="recovery-username" name="username" autocomplete="username" required></div><p class="form-error" data-form-error aria-live="polite"></p><button class="button button--dark" type="submit" data-recovery-start>Find recovery question</button><section class="recovery-step" data-recovery-question hidden><p class="notice" data-question-text></p><div class="field"><label for="recovery-answer">Your answer</label><input id="recovery-answer" name="answer" autocomplete="off"></div><button class="button button--dark" type="button" data-verify-answer>Verify answer</button></section><section class="recovery-step" data-recovery-password hidden><input type="hidden" name="recovery_token"><div class="field"><label for="new-password">New password</label><div class="password-row"><input id="new-password" name="new_password" type="password" minlength="10" autocomplete="new-password"><button class="password-toggle" type="button" data-password-toggle="new-password">Show</button></div></div><div class="field"><label for="new-password-confirm">Confirm new password</label><input id="new-password-confirm" name="confirm_new_password" type="password" minlength="10" autocomplete="new-password"></div><button class="button button--dark" type="button" data-complete-recovery>Set new password</button></section><p class="form-foot" data-recovery-message aria-live="polite"></p></form></main><div data-site-footer></div><div class="toast-region" aria-live="polite"></div></body></html>
