<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact | Albarika</title><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/storefront.css"><link rel="stylesheet" href="css/responsive.css"><script type="module" src="js/site.js"></script><script type="module" src="js/contact.js"></script></head><body data-page="contact"><div data-site-header></div><main class="content-page section-wrap"><header class="content-page__head"><p class="eyebrow eyebrow--ink">LET’S TALK CLOTH & FIT</p><h1>Tell us what you’d like made.</h1><p>Ask about a fabric, a fitting, or a made-to-measure piece. We’ll help with the next step.</p></header><form class="form-shell dashboard-form" data-contact-form><div class="field"><label for="contact-name">Your name</label><input id="contact-name" name="name" required maxlength="120" autocomplete="name"></div><div class="field"><label for="contact-email">Email address</label><input id="contact-email" name="email" type="email" required maxlength="254" autocomplete="email"></div><div class="field"><label for="contact-phone">Phone (optional)</label><input id="contact-phone" name="phone" type="tel" maxlength="40" autocomplete="tel"></div><div class="field"><label for="contact-subject">What can we help with?</label><input id="contact-subject" name="subject" required maxlength="180"></div><div class="field"><label for="contact-message">A few details</label><textarea id="contact-message" name="message" required maxlength="5000"></textarea></div><p class="form-error" data-form-error aria-live="polite"></p><button class="button button--dark" type="submit">Send enquiry <span aria-hidden="true">↗</span></button></form></main><div data-site-footer></div><div class="toast-region" aria-live="polite"></div></body></html>
